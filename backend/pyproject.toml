[project]
name = "ai-job-agent-backend"
version = "2.0.0"
description = "AI Job Application Agent - Backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "passlib>=1.7",
    "playwright>=1.49",
    "psycopg2-binary>=2.9",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
    "python-multipart>=0.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "uvicorn>=0.34",
    "pypdf2>=3.0",
    "pdfminer-six>=20221105",
    "python-docx>=1.1",
    "reportlab>=4.2",
    "pymupdf>=1.25",
    "pyyaml>=6.0",
    "openai>=1.55",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "black>=24.10",
    "aiosqlite>=0.20",
    "faker>=33.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 120
target-version = ["py311"]
